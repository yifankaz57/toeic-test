<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOEIC 実力テスト</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@300;400;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --card: #1a1a26;
    --border: #2a2a40;
    --accent: #4fd1c5;
    --accent2: #f6ad55;
    --danger: #fc8181;
    --success: #68d391;
    --text: #e2e8f0;
    --muted: #718096;
    --part1: #667eea;
    --part2: #f093fb;
    --part5: #4fd1c5;
    --part7: #f6ad55;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Noise overlay */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 0;
  }

  /* ─── SCREENS ─── */
  .screen { display: none; min-height: 100vh; position: relative; z-index: 1; }
  .screen.active { display: flex; flex-direction: column; }

  /* ─── START SCREEN ─── */
  #start-screen {
    align-items: center; justify-content: center;
    padding: 40px 20px; text-align: center;
  }
  .logo { font-family: 'Bebas Neue', sans-serif; font-size: clamp(72px, 15vw, 140px); line-height: 0.9; color: var(--accent); letter-spacing: 4px; }
  .logo span { color: var(--accent2); }
  .subtitle { font-size: 13px; letter-spacing: 6px; text-transform: uppercase; color: var(--muted); margin: 12px 0 40px; }
  .info-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 480px; margin: 0 auto 40px;
  }
  .info-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 12px;
  }
  .info-num { font-family: 'Bebas Neue', sans-serif; font-size: 36px; color: var(--accent); }
  .info-label { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .part-list { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 40px; }
  .part-tag {
    padding: 6px 14px; border-radius: 20px; font-size: 12px; font-family: 'IBM Plex Mono', monospace;
    border: 1px solid; font-weight: 600;
  }
  .tag-p1 { color: var(--part1); border-color: var(--part1); background: rgba(102,126,234,0.1); }
  .tag-p2 { color: var(--part2); border-color: var(--part2); background: rgba(240,147,251,0.1); }
  .tag-p5 { color: var(--part5); border-color: var(--part5); background: rgba(79,209,197,0.1); }
  .tag-p7 { color: var(--part7); border-color: var(--part7); background: rgba(246,173,85,0.1); }
  .start-btn {
    background: var(--accent); color: #0a0a0f; border: none; padding: 16px 56px;
    font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 3px;
    border-radius: 8px; cursor: pointer; transition: all .2s;
  }
  .start-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(79,209,197,0.4); }
  .disclaimer { font-size: 11px; color: var(--muted); margin-top: 20px; line-height: 1.6; }

  /* ─── TEST SCREEN ─── */
  #test-screen { padding: 0; }
  .test-header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(10,10,15,0.95); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px; display: flex; align-items: center; gap: 16px;
  }
  .q-counter { font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .q-counter span { color: var(--text); font-weight: 600; }
  .progress-bar { flex: 1; height: 4px; background: var(--border); border-radius: 2px; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width .3s; }
  .timer {
    font-family: 'Bebas Neue', sans-serif; font-size: 24px; color: var(--accent2);
    white-space: nowrap; min-width: 60px; text-align: right;
  }
  .timer.warning { color: var(--danger); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }

  .test-body { flex: 1; padding: 24px 20px; max-width: 700px; margin: 0 auto; width: 100%; }

  .part-header {
    display: flex; align-items: center; gap: 10px; margin-bottom: 20px;
    padding: 10px 16px; border-radius: 8px; border-left: 3px solid;
  }
  .part-header.p1 { background: rgba(102,126,234,0.1); border-color: var(--part1); }
  .part-header.p2 { background: rgba(240,147,251,0.1); border-color: var(--part2); }
  .part-header.p5 { background: rgba(79,209,197,0.1); border-color: var(--part5); }
  .part-header.p7 { background: rgba(246,173,85,0.1); border-color: var(--part7); }
  .part-name { font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; }
  .part-desc { font-size: 12px; color: var(--muted); }

  .question-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 24px; margin-bottom: 20px;
  }
  .q-num { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); margin-bottom: 12px; }
  .q-text { font-size: 16px; line-height: 1.7; margin-bottom: 20px; }
  .q-passage {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px; font-size: 14px; line-height: 1.8; margin-bottom: 20px; color: #cbd5e0;
  }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option-btn {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 16px; text-align: left; cursor: pointer;
    font-family: 'Noto Sans JP', sans-serif; font-size: 14px; color: var(--text);
    display: flex; align-items: flex-start; gap: 12px; transition: all .15s;
  }
  .option-btn:hover { border-color: var(--accent); background: rgba(79,209,197,0.05); }
  .option-btn.selected { border-color: var(--accent); background: rgba(79,209,197,0.1); color: var(--accent); }
  .option-btn.correct { border-color: var(--success); background: rgba(104,211,145,0.1); color: var(--success); }
  .option-btn.wrong { border-color: var(--danger); background: rgba(252,129,129,0.1); color: var(--danger); }
  .opt-label {
    font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 13px;
    min-width: 20px; color: var(--muted);
  }
  .option-btn.selected .opt-label { color: var(--accent); }
  .option-btn.correct .opt-label { color: var(--success); }
  .option-btn.wrong .opt-label { color: var(--danger); }

  .explanation {
    margin-top: 14px; padding: 14px; background: rgba(79,209,197,0.05);
    border: 1px solid rgba(79,209,197,0.2); border-radius: 10px;
    font-size: 13px; line-height: 1.7; color: #a0aec0; display: none;
  }
  .explanation.show { display: block; }
  .explanation strong { color: var(--accent); }

  .nav-row { display: flex; justify-content: flex-end; margin-top: 8px; }
  .next-btn {
    background: var(--accent); color: #0a0a0f; border: none; padding: 12px 32px;
    font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 2px;
    border-radius: 8px; cursor: pointer; transition: all .2s; opacity: 0; pointer-events: none;
  }
  .next-btn.show { opacity: 1; pointer-events: all; }
  .next-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(79,209,197,0.3); }

  /* ─── RESULTS SCREEN ─── */
  #results-screen { padding: 40px 20px; max-width: 700px; margin: 0 auto; }
  .result-title { font-family: 'Bebas Neue', sans-serif; font-size: 56px; color: var(--accent); margin-bottom: 4px; }
  .result-subtitle { font-size: 13px; color: var(--muted); letter-spacing: 4px; text-transform: uppercase; margin-bottom: 32px; }
  .score-hero {
    background: var(--card); border: 1px solid var(--border); border-radius: 20px;
    padding: 32px; text-align: center; margin-bottom: 24px;
  }
  .score-num { font-family: 'Bebas Neue', sans-serif; font-size: 96px; line-height: 1; color: var(--accent); }
  .score-denom { font-family: 'IBM Plex Mono', monospace; font-size: 18px; color: var(--muted); }
  .score-pct { font-size: 14px; color: var(--muted); margin-top: 8px; }
  .toeic-est {
    margin-top: 16px; padding: 12px 24px; display: inline-block;
    border-radius: 8px; font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 2px;
  }
  .toeic-est.low { background: rgba(252,129,129,0.15); color: var(--danger); border: 1px solid var(--danger); }
  .toeic-est.mid { background: rgba(246,173,85,0.15); color: var(--accent2); border: 1px solid var(--accent2); }
  .toeic-est.good { background: rgba(104,211,145,0.15); color: var(--success); border: 1px solid var(--success); }

  .part-scores {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 24px;
  }
  .part-score-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px;
  }
  .part-score-label { font-size: 11px; font-family: 'IBM Plex Mono', monospace; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; }
  .part-score-bar { height: 6px; background: var(--border); border-radius: 3px; margin: 8px 0; }
  .part-score-fill { height: 100%; border-radius: 3px; transition: width 1s .5s; }
  .part-score-num { font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 600; }

  .weakness-box {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 20px; margin-bottom: 24px;
  }
  .weakness-title { font-size: 13px; font-weight: 600; color: var(--accent2); margin-bottom: 12px; letter-spacing: 1px; }
  .weakness-item { font-size: 13px; color: var(--muted); padding: 6px 0; border-bottom: 1px solid var(--border); line-height: 1.6; }
  .weakness-item:last-child { border-bottom: none; }
  .weakness-item strong { color: var(--text); }

  .restart-btn {
    width: 100%; background: var(--surface); color: var(--accent); border: 1px solid var(--accent);
    padding: 14px; font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 3px;
    border-radius: 10px; cursor: pointer; transition: all .2s; margin-top: 8px;
  }
  .restart-btn:hover { background: rgba(79,209,197,0.1); }

  @media (max-width: 480px) {
    .info-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .part-scores { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- ═══ START SCREEN ═══ -->
<div id="start-screen" class="screen active">
  <div class="logo">TOEIC<br><span>TEST</span></div>
  <div class="subtitle">実力診断テスト</div>
  <div class="info-grid">
    <div class="info-card"><div class="info-num">50</div><div class="info-label">問題数</div></div>
    <div class="info-card"><div class="info-num">25</div><div class="info-label">分（目安）</div></div>
    <div class="info-card"><div class="info-num">4</div><div class="info-label">パート</div></div>
  </div>
  <div class="part-list">
    <span class="part-tag tag-p1">Part 1 写真描写 ×6</span>
    <span class="part-tag tag-p2">Part 2 応答問題 ×14</span>
    <span class="part-tag tag-p5">Part 5 短文穴埋め ×20</span>
    <span class="part-tag tag-p7">Part 7 読解 ×10</span>
  </div>
  <button class="start-btn" onclick="startTest()">テスト開始</button>
  <div class="disclaimer">※ Part1・2はリスニング代わりに英文で出題します<br>本番と完全一致ではありませんが、実力把握には十分です</div>
</div>

<!-- ═══ TEST SCREEN ═══ -->
<div id="test-screen" class="screen">
  <div class="test-header">
    <div class="q-counter">Q<span id="q-current">1</span> / <span id="q-total">50</span></div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="timer" id="timer">25:00</div>
  </div>
  <div class="test-body" id="test-body"></div>
</div>

<!-- ═══ RESULTS SCREEN ═══ -->
<div id="results-screen" class="screen">
  <div class="result-title">RESULTS</div>
  <div class="result-subtitle">診断完了</div>

  <div class="score-hero">
    <div class="score-num" id="score-num">0</div>
    <div class="score-denom">/ 50問</div>
    <div class="score-pct" id="score-pct"></div>
    <div class="toeic-est" id="toeic-est"></div>
  </div>

  <div class="part-scores" id="part-scores"></div>

  <div class="weakness-box" id="weakness-box">
    <div class="weakness-title">📊 分析 & 次のアクション</div>
    <div id="weakness-content"></div>
  </div>

  <button class="restart-btn" onclick="restartTest()">もう一度挑戦</button>
</div>

<script>
// ═══════════════════════════════════════════════════════
//  QUESTION DATA
// ═══════════════════════════════════════════════════════
const questions = [
  // ── PART 1: 写真描写 (Q1-6) ──
  {
    id:1, part:'Part 1', partClass:'p1', partDesc:'写真描写問題',
    text: '【写真の状況】 A woman is sitting at a desk and typing on a keyboard. Which description best matches the photo?',
    options:['She is standing near a window.','She is typing on a keyboard at a desk.','She is eating lunch at a table.','She is talking on the phone.'],
    answer:1, explanation:'<strong>正解: (B)</strong> 「女性がデスクに座ってキーボードを打っている」という状況を正しく描写しています。(A)は"standing"が誤り。(C)(D)は全く異なる動作です。'
  },
  {
    id:2, part:'Part 1', partClass:'p1', partDesc:'写真描写問題',
    text: '【写真の状況】 Several boxes are stacked against the wall in a warehouse. Which description best matches the photo?',
    options:['Workers are unloading trucks outside.','The shelves are completely empty.','Boxes are piled up along the wall.','A forklift is moving through the aisle.'],
    answer:2, explanation:'<strong>正解: (C)</strong> 「箱が壁に沿って積まれている」という描写が正しい。(A)(D)は人や機械の動作で写真にない。(B)は棚が空というのも誤りです。'
  },
  {
    id:3, part:'Part 1', partClass:'p1', partDesc:'写真描写問題',
    text: '【写真の状況】 A man is presenting a chart on a screen to a group of colleagues in a conference room. Which is correct?',
    options:['He is reading a newspaper alone.','He is presenting to a group in a meeting room.','The room is empty and the lights are off.','Colleagues are sleeping during the meeting.'],
    answer:1, explanation:'<strong>正解: (B)</strong> 会議室でグループにプレゼンしている場面の正確な描写。(A)(C)(D)はすべて状況と一致しません。'
  },
  {
    id:4, part:'Part 1', partClass:'p1', partDesc:'写真描写問題',
    text: '【写真の状況】 A chef is preparing food in a restaurant kitchen. Steam is rising from the pots. Which fits best?',
    options:['A chef is cooking in a kitchen.','Customers are ordering at a counter.','The kitchen is unoccupied and clean.','A waiter is serving food at a table.'],
    answer:0, explanation:'<strong>正解: (A)</strong> 「シェフがキッチンで料理している」という正確な描写。(B)(D)は違う場所・人物。(C)は人がいないと言っているので誤りです。'
  },
  {
    id:5, part:'Part 1', partClass:'p1', partDesc:'写真描写問題',
    text: '【写真の状況】 Two people are shaking hands outside a building. Both are smiling. Which best describes this?',
    options:['They are arguing in front of the door.','Two people are exchanging handshakes outside.','One person is waving goodbye inside a car.','They are sitting on a bench together.'],
    answer:1, explanation:'<strong>正解: (B)</strong> 「建物の外で二人が握手している」を正確に描写。(A)は"arguing"が誤り。(C)(D)は状況が全く異なります。'
  },
  {
    id:6, part:'Part 1', partClass:'p1', partDesc:'写真描写問題',
    text: '【写真の状況】 A bicycle is parked next to a tree on a sidewalk. No one is near it. Which is correct?',
    options:['A man is riding a bicycle through the park.','A bicycle is leaning against a tree on the sidewalk.','Two bikes are chained to a fence.','A child is learning to ride a bicycle.'],
    answer:1, explanation:'<strong>正解: (B)</strong> 「自転車が歩道の木の横に止まっている」が正確。(A)は人が乗っている、(C)は2台・フェンス、(D)は子どもが練習中と全て誤りです。'
  },

  // ── PART 2: 応答問題 (Q7-20) ──
  {
    id:7, part:'Part 2', partClass:'p2', partDesc:'応答問題',
    text: '"When is the quarterly report due?"',
    options:['It\'s on the top shelf.','By the end of this Friday.','Yes, I submitted it yesterday.'],
    answer:1, explanation:'<strong>正解: (B)</strong> "When"（いつ）という時間を聞く質問への自然な答えは"By the end of this Friday"（今週の金曜日まで）です。(A)は場所の答え。(C)はYes/No疑問文への返答です。'
  },
  {
    id:8, part:'Part 2', partClass:'p2', partDesc:'応答問題',
    text: '"Could you help me move these chairs to the conference room?"',
    options:['Sure, I\'ll be right there.','The conference room is on the 3rd floor.','Yes, the meeting starts at 2.'],
    answer:0, explanation:'<strong>正解: (A)</strong> 依頼に対して「もちろん、すぐ行きます」と応答するのが最も自然。(B)は場所の情報だけで応答になっていない。(C)は全く別の話題です。'
  },
  {
    id:9, part:'Part 2', partClass:'p2', partDesc:'応答問題',
    text: '"Who is in charge of the new product launch?"',
    options:['It launches next month.','Sandra from the marketing team.','The product is very popular.'],
    answer:1, explanation:'<strong>正解: (B)</strong> "Who"（誰）という質問に対して人名で答えるのが正しい。(A)は"When"への答え。(C)は製品の評判の話で質問にずれています。'
  },
  {
    id:10, part:'Part 2', partClass:'p2', partDesc:'応答問題',
    text: '"Why was the office closed yesterday?"',
    options:['It opens at 9 a.m.','Because of a scheduled maintenance.','There are 50 employees here.'],
    answer:1, explanation:'<strong>正解: (B)</strong> "Why"（なぜ）への答えは理由を述べるBが正解。"Because of a scheduled maintenance"（定期メンテナンスのため）。(A)は開店時間、(C)は従業員数で関係ありません。'
  },
  {
    id:11, part:'Part 2', partClass:'p2', partDesc:'応答問題',
    text: '"Have you already spoken to the client about the delay?"',
    options:['Not yet. I\'ll call them this afternoon.','The delay was 30 minutes.','Yes, the client office is downtown.'],
    answer:0, explanation:'<strong>正解: (A)</strong> 「クライアントに連絡したか」という質問に「まだです、今日の午後に電話します」が自然な答え。(B)は遅延の時間だけ言っている。(C)はオフィスの場所で全く別の話です。'
  },
  {
    id:12, part:'Part 2', partClass:'p2', partDesc:'応答問題',
    text: '"Where should I send the invoice?"',
    options:['To the accounting department.','It was sent last Tuesday.','The invoice total is $500.'],
    answer:0, explanation:'<strong>正解: (A)</strong> "Where"（どこへ）の問いに場所（経理部）で答えるのが正解。(B)は過去形で誰が送ったかの話。(C)は金額の話です。'
  },
  {
    id:13, part:'Part 2', partClass:'p2', partDesc:'応答問題',
    text: '"Is the training session tomorrow or the day after?"',
    options:['I attended the training last year.','It\'s been postponed to Thursday.','The trainer is very experienced.'],
    answer:1, explanation:'<strong>正解: (B)</strong> 二択（明日か明後日か）への答えとして「木曜日に延期された」が最も適切な応答。(A)は過去の話。(C)はトレーナーの資質の話でずれています。'
  },
  {
    id:14, part:'Part 2', partClass:'p2', partDesc:'応答問題',
    text: '"How many people attended the annual conference?"',
    options:['It was held in Chicago.','The conference was very informative.','Around two hundred.'],
    answer:2, explanation:'<strong>正解: (C)</strong> "How many"（何人）という数量を聞く質問に数字で答える(C)"Around two hundred"が正解。(A)は場所、(B)は感想で数字がありません。'
  },
  {
    id:15, part:'Part 2', partClass:'p2', partDesc:'応答問題',
    text: '"Do you know if the cafeteria is open on weekends?"',
    options:['The cafeteria food is delicious.','I think it closes at 2 p.m. on Saturdays.','We usually eat at our desks.'],
    answer:1, explanation:'<strong>正解: (B)</strong> 週末の営業時間を尋ねる間接疑問文。「土曜は午後2時に閉まると思います」が最も直接的な答え。(A)は味の話。(C)は習慣の話でずれています。'
  },
  {
    id:16, part:'Part 2', partClass:'p2', partDesc:'応答問題',

// ═══════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════
let currentQ = 0;
let answers = new Array(50).fill(null);
let timerInterval = null;
let timeLeft = 25 * 60;
let answered = false;
let lastPassageIdx = null;

// ═══════════════════════════════════════════════════════
//  TIMER
// ═══════════════════════════════════════════════════════
function startTimer() {
  timerInterval = setInterval(() => {
    timeLeft--;
    const m = Math.floor(timeLeft / 60);
    const s = timeLeft % 60;
    const el = document.getElementById('timer');
    el.textContent = `${m}:${s.toString().padStart(2,'0')}`;
    if (timeLeft <= 180) el.classList.add('warning');
    if (timeLeft <= 0) { clearInterval(timerInterval); showResults(); }
  }, 1000);
}

// ═══════════════════════════════════════════════════════
//  RENDER QUESTION
// ═══════════════════════════════════════════════════════
function renderQuestion() {
  const q = questions[currentQ];
  answered = false;

  document.getElementById('q-current').textContent = currentQ + 1;
  document.getElementById('q-total').textContent = questions.length;
  document.getElementById('progress-fill').style.width = ((currentQ / questions.length) * 100) + '%';

  // Find the passage: use current question's if exists, else look back
  let passage = q.passage;
  if (passage === null && q.part === 'Part 7') {
    for (let i = currentQ - 1; i >= 0; i--) {
      if (questions[i].passage !== null && questions[i].passage !== undefined) {
        passage = questions[i].passage;
        break;
      }
    }
  }

  let html = `
    <div class="part-header ${q.partClass}">
      <span class="part-name">${q.part}</span>
      <span class="part-desc">${q.partDesc}</span>
    </div>
    <div class="question-card">
      <div class="q-num">Question ${q.id} of 50</div>
      ${passage ? `<div class="q-passage">${passage.replace(/\n/g,'<br>')}</div>` : ''}
      <div class="q-text">${q.text}</div>
      <div class="options">
        ${q.options.map((opt, i) => `
          <button class="option-btn" onclick="selectAnswer(${i})" id="opt-${i}">
            <span class="opt-label">${String.fromCharCode(65+i)}</span>
            <span>${opt}</span>
          </button>
        `).join('')}
      </div>
      <div class="explanation" id="explanation"></div>
    </div>
    <div class="nav-row">
      <button class="next-btn" id="next-btn" onclick="nextQuestion()">
        ${currentQ < questions.length - 1 ? '次の問題 →' : '結果を見る'}
      </button>
    </div>
  `;

  document.getElementById('test-body').innerHTML = html;
  window.scrollTo(0, 0);
}

function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  answers[currentQ] = idx;

  const q = questions[currentQ];
  q.options.forEach((_, i) => {
    const btn = document.getElementById(`opt-${i}`);
    if (i === q.answer) btn.classList.add('correct');
    else if (i === idx) btn.classList.add('wrong');
  });

  const exp = document.getElementById('explanation');
  exp.innerHTML = q.explanation;
  exp.classList.add('show');

  document.getElementById('next-btn').classList.add('show');
}

function nextQuestion() {
  currentQ++;
  if (currentQ >= questions.length) {
    clearInterval(timerInterval);
    showResults();
  } else {
    renderQuestion();
  }
}

// ═══════════════════════════════════════════════════════
//  RESULTS
// ═══════════════════════════════════════════════════════
function showResults() {
  document.getElementById('test-screen').classList.remove('active');
  document.getElementById('results-screen').classList.add('active');

  const partInfo = {
    'Part 1': { total:6, color: 'var(--part1)', label:'Part 1 写真描写' },
    'Part 2': { total:14, color: 'var(--part2)', label:'Part 2 応答問題' },
    'Part 5': { total:20, color: 'var(--part5)', label:'Part 5 短文穴埋め' },
    'Part 7': { total:10, color: 'var(--part7)', label:'Part 7 読解' },
  };

  let totalCorrect = 0;
  const partCorrect = {};
  Object.keys(partInfo).forEach(p => partCorrect[p] = 0);

  questions.forEach((q, i) => {
    if (answers[i] === q.answer) {
      totalCorrect++;
      partCorrect[q.part]++;
    }
  });

  const pct = Math.round((totalCorrect / 50) * 100);

  // Estimate TOEIC range
  let toeicEst, estClass;
  if (pct < 40) { toeicEst = '推定 TOEIC 250〜320点'; estClass = 'low'; }
  else if (pct < 55) { toeicEst = '推定 TOEIC 320〜420点'; estClass = 'low'; }
  else if (pct < 68) { toeicEst = '推定 TOEIC 420〜490点'; estClass = 'mid'; }
  else if (pct < 80) { toeicEst = '推定 TOEIC 490〜560点'; estClass = 'mid'; }
  else { toeicEst = '推定 TOEIC 560点以上'; estClass = 'good'; }

  document.getElementById('score-num').textContent = totalCorrect;
  document.getElementById('score-pct').textContent = `正答率 ${pct}%`;
  const estEl = document.getElementById('toeic-est');
  estEl.textContent = toeicEst;
  estEl.className = `toeic-est ${estClass}`;

  // Part scores
  let partHTML = '';
  Object.entries(partInfo).forEach(([part, info]) => {
    const c = partCorrect[part];
    const t = info.total;
    const p = Math.round((c / t) * 100);
    partHTML += `
      <div class="part-score-card">
        <div class="part-score-label" style="color:${info.color}">${info.label}</div>
        <div class="part-score-num" style="color:${info.color}">${c} / ${t} 問</div>
        <div class="part-score-bar">
          <div class="part-score-fill" style="width:${p}%;background:${info.color}"></div>
        </div>
        <div style="font-size:12px;color:var(--muted)">${p}%正解</div>
      </div>`;
  });
  document.getElementById('part-scores').innerHTML = partHTML;

  // Weakness analysis
  const weak = [];
  Object.entries(partInfo).forEach(([part, info]) => {
    const p = Math.round((partCorrect[part] / info.total) * 100);
    if (p < 50) weak.push({ part, p, label: info.label });
  });

  let adviceHTML = '';
  if (weak.length === 0) {
    adviceHTML = '<div class="weakness-item">✅ 全パートで50%以上正解しています。バランスよく伸びています。次は模試で時間配分を練習しましょう。</div>';
  } else {
    weak.sort((a,b) => a.p - b.p).forEach(w => {
      let tip = '';
      if (w.part === 'Part 1') tip = '写真の状況を「人物の動作・物の状態」で整理する練習を。選択肢の消去法が有効です。';
      else if (w.part === 'Part 2') tip = '疑問詞の最初の一語に集中。Who→人名、Where→場所、Why→理由と対応を体に染み込ませましょう。';
      else if (w.part === 'Part 5') tip = '品詞判別（名詞/動詞/形容詞/副詞）と時制・態（能動/受動）の2軸で解く訓練を。でる1000問が最適です。';
      else if (w.part === 'Part 7') tip = 'まず設問を読んでから本文を読む「先読み」を必ず実践。答えのキーワードを探す練習を積みましょう。';
      adviceHTML += `<div class="weakness-item"><strong>⚠️ ${w.label}（正解率${w.p}%）</strong><br>${tip}</div>`;
    });
  }

  // General advice
  if (pct < 55) {
    adviceHTML += '<div class="weakness-item"><strong>📌 優先事項</strong><br>まず単語力の底上げを。金のフレーズの頻出600語を2週間で1周させることを最優先にしてください。</div>';
  } else {
    adviceHTML += '<div class="weakness-item"><strong>📌 次のステップ</strong><br>公式問題集で時間を計って模試に挑戦。問題への慣れが得点に直結します。</div>';
  }

  document.getElementById('weakness-content').innerHTML = adviceHTML;

  // Animate bars
  setTimeout(() => {
    document.querySelectorAll('.part-score-fill').forEach(el => {
      const w = el.style.width; el.style.width = '0'; 
      setTimeout(() => el.style.width = w, 100);
    });
  }, 100);
}

// ═══════════════════════════════════════════════════════

function startTest() {
  document.getElementById('start-screen').classList.remove('active');
  document.getElementById('test-screen').classList.add('active');
  renderQuestion();
  startTimer();
}

function restartTest() {
  currentQ = 0;
  answers = new Array(50).fill(null);
  timeLeft = 25 * 60;
  answered = false;
  clearInterval(timerInterval);
  document.getElementById('results-screen').classList.remove('active');
  document.getElementById('timer').classList.remove('warning');
  document.getElementById('timer').textContent = '25:00';
  document.getElementById('test-screen').classList.add('active');
  renderQuestion();
  startTimer();
}
</script>
